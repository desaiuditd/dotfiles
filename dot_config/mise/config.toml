[tools]
"aqua:go-task/task" = "latest"
"aqua:kdash-rs/kdash" = "latest"
"aqua:mike-engel/jwt-cli" = "latest"
"aqua:txn2/kubefwd" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
awscli = "latest"
bat = "latest"
bun = "latest"
difftastic = "latest"
dive = "latest"  # Analyze Docker images
duf = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
helm = "latest"
helmfile = "latest"
jq = "latest"
k3d = "latest"
krew = "latest"
kubectl = "latest"
kubectx = "latest"
lazydocker = "latest"
lychee = "latest"
miller = "latest"
neovim = "latest"
node = "lts"
"npm:corepack" = "latest"
"npm:@minimax-ai/code" = { version = "latest", allow_builds = [ "better-sqlite3" ] }
"npm:@modelcontextprotocol/server-sequential-thinking" = "latest"
"npm:tractatus_thinking" = "latest"
"npm:wrangler" = "latest"
uv = "latest"  # uv needs to be installed first, before other pipx packages.
"pipx:apm-cli" = "latest"
"pipx:beancount" = "latest"
"pipx:beanquery" = "latest"
"pipx:github/spec-kit" = "latest"
prettier = "latest"
python = "latest"
ripgrep = "latest"
rtk = "latest"
starship = "latest"
yq = "latest"
zoxide = "latest"

[settings]
node.corepack = true

[settings.github]
credential_command = "gh auth token"
use_git_credentials = true

[shell_alias]
# https://github.com/orgs/pnpm/discussions/3383#discussioncomment-16247139
# https://github.com/nodejs/corepack/issues/833
"pn" = "pnpm"
"pnx" = "pnpm dlx"
